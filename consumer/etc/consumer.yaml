Name: consumer.rpc
ListenOn: 0.0.0.0:8080
# Etcd:
#   Hosts:
#   - 127.0.0.1:2379
#   Key: consumer.rpc

# 设置消费者数量
Consumer:
  Concurrency: 1
  NotCompletedConcurrency: 1
  MigrationWallet: ""          # 平台用于迁移的自有钱包，必须配置
  MigrationConfigIndex: 2      # cpmm fee tier config_index，默认 2(0.50%)
  MigrationTarget: "raydium_cpmm" # 可选: raydium_cpmm | pump_amm  

Sol:
  ChainId: 100000
  NodeUrl:
    - "https://devnet.helius-rpc.com/?api-key=31dcdddd-35b1-4f63-bfd4-37e7e3ed6fa4"
  WSUrl: "wss://devnet.helius-rpc.com/?api-key=31dcdddd-35b1-4f63-bfd4-37e7e3ed6fa4"

Mysql:
  User: root
  Password: "123456"
  Host: 172.17.112.1
  Port: 3306
  DBname: rc_dex_study

Redis:
  Key: dexs
  Host: 172.17.112.1:6379
  Type: node
  PingTimeout: 10s
  Tls: false

BlockPipeline:
  PairBatchConcurrency: 8
  PairBatchRetryLimits:
    MaxAttempts: 3
    WindowMinutes: 5
    BackoffSeconds:
      - 5
      - 30
      - 120
  MetadataCacheTTLHours: 24
  MarketPushTimeoutMs: 2000
  Metrics:
    Namespace: "block_persistence"
    EnableVerboseLogs: true


# market服务配置
market_service:
  target: localhost:8090
  nonblock: true
  timeout: 10000  # 10 seconds timeout
  transport: tcp
  middlewares:
    breaker: false

# 交易服务配置
trade_service:
  target: localhost:8100
  nonblock: true
  timeout: 10000
  transport: tcp
  middlewares:
    breaker: false



# RocketMQ 配置
RocketMQ:
  NameServers:
    - "127.0.0.1:9876"
  AccessKey: ""     # 可选，启用 ACL 时填写
  SecretKey: ""     # 可选，启用 ACL 时填写
  MaxMessageSize: 16777216  # 16MB
  Topics:
    Blocks: "solana-blocks"
    Retry: "solana-blocks-retry"
    Migration: "pump-migration"
  Producer:
    SendTimeout: 10s
    RetryTimes: 2
    CompressLevel: 3  # gzip 压缩级别 (3=快速压缩，6=默认，9=最大压缩)
  Consumer:
    GroupName: "block-consumer-group"
    ConsumeFromWhere: "CONSUME_FROM_LAST_OFFSET"
    MessageModel: "CLUSTERING"
    MaxReconsumeTimes: 3
    ConsumeTimeout: 15m

# 交易过滤配置
BlockFilter:
  Enabled: true
  TargetProtocols:
    # PumpFun 协议 - 匹配所有交易
    - Name: "PumpFun"
      ProgramID: "6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P"

    # PumpSwap/PumpAMM 协议 - 匹配所有交易
    - Name: "PumpSwap"
      ProgramID: "pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA"

    # Raydium CLMM 主网 - 匹配所有交易
    - Name: "Raydium_CLMM"
      ProgramID: "CAMMCzo5YL8w4VFF8KVHrK22GGUsp5VTaW7grrKgrWqK"

    # Raydium CLMM DevNet - 匹配所有交易
    - Name: "Raydium_CLMM_DevNet"
      ProgramID: "GodmWN2QXikut2nwHuFGpCPeN6nBb2vuCFknVy3edxVw"

    # Raydium CPMM 主网 - 匹配所有交易
    - Name: "Raydium_CPMM"
      ProgramID: "CPMMoo8L3F4NbTegBCKVNunggL7H1ZpdTHKxQB5qKP1C"

    # Raydium CPMM DevNet - 匹配所有交易
    - Name: "Raydium_CPMM_DevNet"
      ProgramID: "6Phx6fHxjmyXLpqFdPgSwe8VkCnaBX2FMH3ZHchGHvA2"

    # SPL Token 程序 - 匹配所有交易
    - Name: "SPL_Token"
      ProgramID: "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"

    # SPL Token 2022 程序 - 匹配所有交易
    - Name: "SPL_Token_2022"
      ProgramID: "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"

# 区块处理器性能配置
BlockProcessor:
  SlotChannelSize: 500       # Block 缓冲区大小
  WorkerCount: 10            # 并发 Worker 数量（生产端处理）
  MaxConcurrentRPC: 5        # 最大并发 RPC 请求数（仅用于 RecoveryManager）
  RPCDelayMs: 100            # RPC 请求之间的延迟（毫秒，仅用于 RecoveryManager）
  BlockNotAvailableRetry:
    MaxAttempts: 3           # RecoveryManager 重试次数
    RetryDelayMs: 1000       # RecoveryManager 重试间隔（毫秒）

# Latest Slot 追踪配置
LatestSlotTracker:
  SyncInterval: 5s           # 同步到 Redis 的间隔

# 失败恢复配置
Recovery:
  Enabled: true              # 是否启用恢复服务
  Interval: 5s               # 恢复检查间隔
  BatchSize: 50              # 每批处理的失败 slot 数量
  MaxRetryCount: 3           # 最大重试次数

# 启动回补配置
StartupBackfill:
  MaxGap: 10000              # 最大全量回补的 gap 大小
  LogDir: "./logs/backfill/" # 大 gap 日志文件目录

# 失败 Slot 日志配置
FailedSlotLog:
  LogDir: "./logs/failed_slots/" # 失败 slot 日志目录


# Geyser gRPC 配置（默认禁用，需要手动启用）
Geyser:
  Enabled: true                     # 是否启用 Geyser 模式（设置为 true 启用）
  Endpoints:
    - "84.32.220.111:10000"          # Helius Geyser 端点（DevNet/MainNet）
    # - "grpc.triton.one:443"        # Triton 备用端点
  Commitment: "confirmed"            # 承诺级别：processed/confirmed/finalized
  EnableTLS: false                   # 启用 TLS
  ReconnectInterval: 5s              # 重连间隔
  HealthCheckInterval: 10s           # 健康检查间隔
  ConnectionTimeout: 30s             # 连接超时
  StreamTimeout: 60s                 # 流超时

  # 服务端过滤器（按 Program ID 过滤交易）
  Filters:
    AccountInclude:
      - "6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P"  # PumpFun
      - "pAMMBay6oceH9fJKBRHGP5D4bD4sWpmSwMn52FMfXEA"  # PumpSwap
      - "CAMMCzo5YL8w4VFF8KVHrK22GGUsp5VTaW7grrKgrWqK"  # Raydium CLMM (MainNet)
      - "GodmWN2QXikut2nwHuFGpCPeN6nBb2vuCFknVy3edxVw"  # Raydium CLMM (DevNet)
      - "CPMMoo8L3F4NbTegBCKVNunggL7H1ZpdTHKxQB5qKP1C"  # Raydium CPMM (MainNet)
      - "6Phx6fHxjmyXLpqFdPgSwe8VkCnaBX2FMH3ZHchGHvA2"  # Raydium CPMM (DevNet)
      - "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"  # SPL Token
      - "TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb"  # SPL Token 2022

  # 降级配置（Geyser 不可用时自动切换到 RPC）
  Fallback:
    Enabled: true                    # 启用自动降级
    MaxConsecutiveFailures: 3        # 连续失败 3 次触发降级
    RecoveryCheckInterval: 30s       # 恢复检查间隔（每 30 秒尝试恢复）
    SlotDelayThreshold: 10s          # slot 延迟阈值（超过 10 秒触发降级）
