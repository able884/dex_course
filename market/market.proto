syntax = "proto3";

package market;
option go_package = "./market";

// GetPumpTokenList
message GetPumpTokenListRequest {
  int64 chain_id = 1;
  int32 pump_status = 2;
  string sorted_type = 3;
  string honeypot_filter = 4;
  int32 page_no = 5;
  int32 page_size = 6;
  string pump_type = 7; // "pumpfun" or "pumpamm", default "pumpfun"
}
message GetPumpTokenListResponse {
  repeated PumpTokenItem list = 1;
  int32 total = 2;
}

message PumpTokenItem {
  int64 chain_id = 1;
  string chain_icon = 2;
  string token_address = 3;
  string token_icon = 4;
  string token_name = 5;
  int64 launch_time = 6;
  double mkt_cap = 7;
  int64 hold_count = 8;
  uint32 txs_24h = 9;
  double vol_24h = 10;
  double domestic_progress = 11;
  string twitter_username = 12;
  string telegram = 13;
  double change24 = 14;
  string pair_address = 15;
}

// GetClmmPoolList
message GetClmmPoolListRequest {
  int64 chain_id = 1;
  int32 pool_version = 2; // 1 for v1, 2 for v2
  string sorted_type = 3;
  int32 page_no = 4;
  int32 page_size = 5;
}

message GetClmmPoolListResponse {
  repeated ClmmPoolItem list = 1;
  int32 total = 2;
}

message ClmmPoolItem {
  int64 chain_id = 1;
  string chain_icon = 2;
  string pool_state = 3;           // Pool state address (like pair_address for pumps)
  string input_vault_mint = 4;     // Input token address
  string output_vault_mint = 5;    // Output token address
  string input_token_symbol = 6;   // Input token symbol
  string output_token_symbol = 7;  // Output token symbol
  string input_token_icon = 8;     // Input token icon
  string output_token_icon = 9;    // Output token icon
  int64 trade_fee_rate = 10;       // Trade fee rate
  int64 launch_time = 11;          // Pool creation time
  double liquidity_usd = 12;       // Liquidity in USD
  uint32 txs_24h = 13;            // 24h transactions
  double vol_24h = 14;            // 24h volume
  double apr = 15;                // Annual percentage rate
  int32 pool_version = 16;        // 1 for v1, 2 for v2
}

message PushTokenInfoRequest {
  int64 chain_id = 1;
  string token_address = 2;
  string pair_address = 3;
  double token_price = 4;
  double mkt_cap = 5;
  string token_name = 6;
  string token_symbol = 7;
  string token_icon = 8;
  int64 launch_time = 9;
  int64 hold_count = 10;
  double change_24 = 11;
  int64 txs_24h = 12;
  int32 pump_status = 13;
}

message GetPoolDetailRequest {
  int64 chain_id = 1;
  string pool_state = 2;
  int32 pool_version = 3; // 1: v1 clmm, 2: v2 clmm, 3: cpmm (default 3)
  string user_wallet_address = 4; // optional: user wallet for position lookup
}

message GetPoolDetailResponse {
  int64 chain_id = 1;
  string pool_state = 2;
  string input_vault_mint = 3;
  string output_vault_mint = 4;
  string input_token_symbol = 5;
  string output_token_symbol = 6;
  string input_token_icon = 7;
  string output_token_icon = 8;
  int64 trade_fee_rate = 9;
  int64 launch_time = 10;
  double liquidity_usd = 11;
  uint32 txs_24h = 12;
  double vol_24h = 13;
  double apr = 14;
  int32 pool_version = 15;
  double locked_percent = 16;
  double input_amount = 17;
  double output_amount = 18;
  double base_reserve = 19;
  double quote_reserve = 20;
  double input_reserve = 21;
  double output_reserve = 22;
  double price = 23;
  double quote_per_base = 24;
  double market_price = 25;
  double user_pooled_input = 26;   // user's share of input token in pool
  double user_pooled_output = 27;  // user's share of output token in pool
  double user_staked_lp = 28;      // user's staked LP amount
  double user_unstaked_lp = 29;    // user's unstaked LP amount
  // Historical price ranges for different time periods
  double price_range_24h_min = 30; // 24H min price
  double price_range_24h_max = 31; // 24H max price
  double price_range_7d_min = 32;  // 7D min price
  double price_range_7d_max = 33;  // 7D max price
  double price_range_30d_min = 34; // 30D min price
  double price_range_30d_max = 35; // 30D max price
}

message PushTokenInfoResponse{
  int64 chain_id = 1;
  string token_address = 2;
  uint32 txs_24h = 3;
  string vol_24h = 4;
  string change_24 = 5;
  string token_price = 6;
  string mkt_cap = 7;
}

message GetPairInfoByTokenRequest {
  int64 chain_id = 1;
  string token_address = 2;
}

message GetPairInfoByTokenResponse {
  int64 chain_id = 1;  // Chain ID
  string address = 2;  // Trading pair address
  string name = 3;  // DEX factory version swap name
  string factory_address = 4;  // Factory contract address
  string base_token_address = 5;  // Base token address
  string token_address = 6;  // Token address
  string base_token_symbol = 7;  // Base token symbol
  string token_symbol = 8;  // Token symbol
  int64 base_token_decimal = 9;  // Base token decimals
  int64 token_decimal = 10;  // Token decimals
  bool base_token_is_native_token = 11;  // Is base token native currency
  bool base_token_is_token0 = 12;  // Is base token token0
  double init_base_token_amount = 13;  // Initial base token liquidity
  double init_token_amount = 14;  // Initial token liquidity
  double current_base_token_amount = 15;  // Current base token liquidity
  double current_token_amount = 16;  // Current token liquidity
  double fdv = 17;  // Fully diluted valuation
  double mkt_cap = 18;  // Market capitalization
  double token_price = 19;  // Token price
  double base_token_price = 20;  // Base token price
  int64 block_num = 21;  // Creation block height
  int64 block_time = 22;  // Creation block timestamp
  double highest_token_price = 23;  // Highest token price
  int64 latest_trade_time = 24;  // Latest on-chain trade timestamp
}

message GetNativeTokenPriceRequest {
  int64  chain_id = 1;
  string search_time = 2;
}

message GetNativeTokenPriceResponse {
  double base_token_price_usd = 1;
}

message GetTokenInfoRequest {
  int64 chain_id = 1;
  string token_address = 2;
}

message GetTokenInfoResponse {
  int64 chain_id = 1;                  // Chain ID
  string address = 2;                  // Token contract address
  string name = 3;                     // Token name
  string symbol = 4;                   // Token symbol
  int64 decimals = 5;                  // Token decimals
  double total_supply = 6;             // Total token supply
  string icon = 7;                     // Token icon URL
  int64 hold_count = 8;                // Number of holders
  int64 is_ca_drop_owner = 9;           // Owner rights renounced
  int64 is_ca_verify = 10;              // Contract verified
  int64 is_honey_scam = 11;             // Honeypot check (Cannot sell)
  int64 is_liquid_lock = 12;            // Liquidity locked
  int64 is_can_pause_trade = 13;        // Can pause trading
  int64 is_can_change_tax = 14;         // Can modify tax rate
  int64 is_have_black_list = 15;        // Has blacklist mechanism
  int64 is_can_all_sell = 16;           // Can sell entire balance
  int64 is_have_proxy = 17;             // Has proxy contract
  int64 is_can_external_call = 18;      // Contract can make external calls
  int64 is_can_add_token = 19;          // Contract has minting capability
  int64 is_can_change_token = 20;       // Owner can modify user balances
  double sell_tax = 21;                // Sell tax rate
  double buy_tax = 22;                 // Buy tax rate
  string twitter_username = 23;        // Twitter username
  string website = 24;                 // Official website
  string telegram = 25;                // Telegram link
  int64 is_check_ca = 26;               // Contract analysis completed
  int64 check_ca_at = 27;              // Contract analysis datetime(3)
  string program = 28;                 // token owner program
}

// Quote CPMM swap for Raydium-style constant product pools
message QuoteCpmmRequest {
  int64 chain_id = 1;
  string pool_state = 2;
  string input_mint = 3;
  string output_mint = 4;
  string amount_in = 5;   // optional: exact-in amount
  string amount_out = 6;  // optional: exact-out desired amount
  int64 slippage_bps = 7; // e.g. 100 = 1%
}

message QuoteCpmmResponse {
  string pay_mint = 1;
  string receive_mint = 2;
  string pay_amount = 3;
  string receive_amount = 4;
  string min_receive_amount = 5;
  string price_impact_pct = 6;
  string fee_rate_pct = 7;
  double price = 8;
}

// Quote CLMM swap for Raydium-style concentrated liquidity pools
message QuoteClmmRequest {
  int64 chain_id = 1;
  string pool_state = 2;
  string input_mint = 3;
  string output_mint = 4;
  string amount_in = 5;   // optional: exact-in amount
  string amount_out = 6;  // optional: exact-out desired amount
  int64 slippage_bps = 7; // e.g. 100 = 1%
}

message QuoteClmmResponse {
  string pay_mint = 1;
  string receive_mint = 2;
  string pay_amount = 3;
  string receive_amount = 4;
  string min_receive_amount = 5;
  string price_impact_pct = 6;
  string fee_rate_pct = 7;
  double price = 8;
}

// GetClmmPoolDepthData - Get CLMM pool depth data
message GetClmmPoolDepthDataRequest {
  int64 chain_id = 1;
  string pool_state = 2; // Pool state address (required)
}

message GetClmmPoolDepthDataResponse {
  int64 count = 1;              // Total count of liquidity data points
  repeated DepthDataPoint line = 2; // Array of liquidity data points
  double time_range_min = 3;    // Minimum price in time range (from trade history)
  double time_range_max = 4;    // Maximum price in time range (from trade history)
}

message DepthDataPoint {
  double price = 1;      // Price at this tick
  string liquidity = 2;  // Liquidity at this tick (as string to preserve precision)
  int32 tick = 3;        // Tick index
}


// GetUserPositions - Get user's liquidity positions
message GetUserPositionsRequest {
  int64 chain_id = 1;                    // Chain ID, default 100000 (Solana)
  string user_wallet_address = 2;         // User wallet address (required)
  string pool_type = 3;                  // Pool type: "all" | "cpmm" | "clmm" (optional, default "all")
  int32 page_no = 4;                     // Page number (optional, default 1)
  int32 page_size = 5;                   // Page size (optional, default 100)
}

message GetUserPositionsResponse {
  repeated PositionItem items = 1;        // Position list
  int32 total = 2;                       // Total count
  int32 page_no = 3;                     // Current page number
  int32 page_size = 4;                   // Page size
}

message PositionItem {
  // Basic info
  int64 chain_id = 1;
  string user_wallet_address = 2;
  string pool_state = 3;                 // Pool state address
  int32 pool_version = 4;                // Pool version: 1=v1 CLMM, 2=v2 CLMM, 3=CPMM
  
  // CLMM position info
  string position_nft_mint = 5;          // Position NFT Mint address (CLMM only)
  string position_nft_account = 6;       // Position NFT account address (CLMM only)
  string personal_position = 7;          // Personal position state account (CLMM only)
  int32 tick_lower_index = 8;            // Lower tick index (CLMM only)
  int32 tick_upper_index = 9;            // Upper tick index (CLMM only)
  string liquidity = 10;                 // Liquidity amount (CLMM only, Uint128 string)
  
  // Token info
  string token0_mint = 11;               // Token0 Mint address
  string token1_mint = 12;               // Token1 Mint address
  string token0_symbol = 13;            // Token0 symbol
  string token1_symbol = 14;            // Token1 symbol
  string token0_name = 15;              // Token0 name
  string token1_name = 16;              // Token1 name
  int32 token0_decimals = 17;           // Token0 decimals
  int32 token1_decimals = 18;           // Token1 decimals
  string token0_icon = 19;              // Token0 icon
  string token1_icon = 20;              // Token1 icon
  
  // Position value info
  double position_value = 21;           // Total position value (USD)
  double token0_amount = 22;            // Token0 amount
  double token1_amount = 23;            // Token1 amount
  double unclaimed_fees = 24;           // Unclaimed fees (USD)
  
  // CLMM price range info
  double price_min = 25;                // Min price (CLMM only)
  double price_max = 26;                // Max price (CLMM only)
  double current_price = 27;            // Current price (CLMM only)
  bool is_in_range = 28;                // Is in price range (CLMM only)
  
  // CPMM position info
  double lp_balance = 29;               // LP Token balance (CPMM only)
  double lp_value = 30;                 // LP Token value (USD, CPMM only)
  
  // Pool info
  double pool_liquidity_usd = 31;       // Pool total liquidity (USD)
  double pool_volume_24h = 32;          // Pool 24h volume (USD)
  double pool_apr = 33;                 // Pool APR
  int64 fee_tier = 34;                 // Fee tier (basis points)
  
  // Metadata
  string tx_hash = 35;                  // Transaction hash that created the position
  int64 block_time = 36;                // Creation timestamp
  int64 created_at = 37;                // Database creation time
  int64 updated_at = 38;                // Database update time
}


service Market {
  rpc GetPumpTokenList(GetPumpTokenListRequest) returns (GetPumpTokenListResponse);
  rpc GetClmmPoolList(GetClmmPoolListRequest) returns (GetClmmPoolListResponse);
  rpc GetPoolDetail(GetPoolDetailRequest) returns (GetPoolDetailResponse);
  rpc PushTokenInfo(PushTokenInfoRequest) returns (PushTokenInfoResponse);
  rpc GetPairInfoByToken(GetPairInfoByTokenRequest) returns (GetPairInfoByTokenResponse);
  rpc GetNativeTokenPrice(GetNativeTokenPriceRequest) returns (GetNativeTokenPriceResponse);
  rpc GetTokenInfo(GetTokenInfoRequest) returns (GetTokenInfoResponse);
  rpc QuoteCpmm(QuoteCpmmRequest) returns (QuoteCpmmResponse);
  rpc QuoteClmm(QuoteClmmRequest) returns (QuoteClmmResponse);
  rpc GetClmmPoolDepthData(GetClmmPoolDepthDataRequest) returns (GetClmmPoolDepthDataResponse);
  // Get user's liquidity positions
  rpc GetUserPositions(GetUserPositionsRequest) returns (GetUserPositionsResponse);
    // Limit order queries
  rpc GetLimitOrderBook(GetLimitOrderBookRequest) returns (GetLimitOrderBookResponse);
  rpc GetUserLimitOrders(GetUserLimitOrdersRequest) returns (GetUserLimitOrdersResponse);
  rpc GetLimitOrderDetail(GetLimitOrderDetailRequest) returns (GetLimitOrderDetailResponse);
  rpc GetLimitOrderMarkets(GetLimitOrderMarketsRequest) returns (GetLimitOrderMarketsResponse);
  rpc GetUserMargin(GetUserMarginRequest) returns (GetUserMarginResponse);

  // Sync margin account balance from blockchain
  rpc SyncMarginBalance(SyncMarginBalanceRequest) returns (SyncMarginBalanceResponse);
  rpc GetLimitOrderFills(GetLimitOrderFillsRequest) returns (GetLimitOrderFillsResponse);
}


// ============================================================
// Limit Order Query Messages
// ============================================================

// Get order book request
message GetLimitOrderBookRequest {
  int64 chain_id = 1;                    // Chain ID (100000 for Solana)
  string market_pda = 2;                 // Market PDA address
  int32 depth = 3;                       // Order book depth (default 20)
}

message GetLimitOrderBookResponse {
  repeated OrderBookLevel bids = 1;      // Buy orders (price descending)
  repeated OrderBookLevel asks = 2;      // Sell orders (price ascending)
  string best_bid = 3;                   // Best bid price
  string best_ask = 4;                   // Best ask price
  string spread = 5;                     // Bid-ask spread
  string mid_price = 6;                  // Mid price
}

message OrderBookLevel {
  string price = 1;                      // Price (display value)
  string quantity = 2;                   // Total quantity at this price level
  string total_value = 3;                // Total value (price * quantity)
  int32 order_count = 4;                 // Number of orders at this level
}

// Get user orders request
message GetUserLimitOrdersRequest {
  int64 chain_id = 1;                    // Chain ID
  string user_wallet_address = 2;        // User wallet address
  string market_pda = 3;                 // Market PDA (optional filter)
  int32 status = 4;                      // Status filter: 0=All, 1=Active, 2=Filled, 3=Cancelled, 4=Expired
  int32 page_no = 5;                     // Page number (default 1)
  int32 page_size = 6;                   // Page size (default 20)
}

message GetUserLimitOrdersResponse {
  repeated UserOrderItem orders = 1;
  int32 total = 2;
  int32 page_no = 3;
  int32 page_size = 4;
}

message UserOrderItem {
  string order_pda = 1;                  // Order PDA
  string market_pda = 2;                 // Market PDA
  string base_symbol = 3;                // Base token symbol
  string quote_symbol = 4;               // Quote token symbol
  int32 side = 5;                        // 1=Bid(Buy), 2=Ask(Sell)
  string price = 6;                      // Price (display value)
  string quantity = 7;                   // Original quantity
  string remaining = 8;                  // Remaining quantity
  string filled_percent = 9;             // Filled percentage (0-100)
  int32 status = 10;                     // Status: 1=Active, 2=Filled, 3=Cancelled, 4=Expired
  int64 created_at = 11;                 // Creation timestamp (Unix seconds)
  int64 expiry_slot = 12;                // Expiry slot (0 for no expiry)
  string total_value = 13;               // Total value (price * quantity)
}

// Get order detail request
message GetLimitOrderDetailRequest {
  int64 chain_id = 1;                    // Chain ID
  string order_pda = 2;                  // Order PDA address
}

message GetLimitOrderDetailResponse {
  OrderDetailItem order = 1;
}

message OrderDetailItem {
  string order_pda = 1;
  int64 order_id = 2;
  string market_pda = 3;
  string base_symbol = 4;
  string quote_symbol = 5;
  string owner = 6;
  string margin_pda = 7;
  int32 side = 8;                        // 1=Bid, 2=Ask
  string price = 9;
  string quantity = 10;
  string remaining = 11;
  string total_value = 12;
  string filled_percent = 13;
  int32 status = 14;
  int64 expiry_slot = 15;
  int32 self_trade_behavior = 16;
  string create_tx_hash = 17;
  string cancel_tx_hash = 18;
  int64 created_at = 19;
  int64 updated_at = 20;
  int64 filled_at = 21;
  int64 cancelled_at = 22;
  int64 expired_at = 23;
  repeated OrderFillItem fills = 24;     // Fill history
}

// Get market list request
message GetLimitOrderMarketsRequest {
  int64 chain_id = 1;                    // Chain ID
  int32 page_no = 2;                     // Page number
  int32 page_size = 3;                   // Page size
}

message GetLimitOrderMarketsResponse {
  repeated MarketItem markets = 1;
  int32 total = 2;
}

message MarketItem {
  string market_pda = 1;
  string base_mint = 2;
  string quote_mint = 3;
  string base_symbol = 4;
  string quote_symbol = 5;
  int32 base_decimals = 6;
  int32 quote_decimals = 7;
  string tick_size = 8;                  // Price tick size (display value)
  string min_quantity = 9;               // Minimum order quantity (display value)
  int32 maker_fee_bps = 10;              // Maker fee in bps
  int32 taker_fee_bps = 11;              // Taker fee in bps
  bool paused = 12;                      // Is market paused
  int64 active_orders = 13;              // Active order count
  string volume_24h = 14;                // 24h volume
  string best_bid = 15;                  // Best bid price
  string best_ask = 16;                  // Best ask price
  int32 status = 17;
  string init_tx_hash = 18;
}

// Get user margin request
message GetUserMarginRequest {
  int64 chain_id = 1;                    // Chain ID
  string user_wallet_address = 2;        // User wallet address
  string market_pda = 3;                 // Market PDA
}

message GetUserMarginResponse {
  MarginAccountItem margin = 1;
}

// Sync margin balance from blockchain
message SyncMarginBalanceRequest {
  int64 chain_id = 1;
  string market_pda = 2;
  string user_wallet_address = 3;
  string tx_hash = 4; // Transaction hash for reference
}

message SyncMarginBalanceResponse {
  bool success = 1;
  string message = 2;
  MarginAccountItem margin = 3;
}

message MarginAccountItem {
  string margin_pda = 1;
  string market_pda = 2;
  string base_symbol = 3;
  string quote_symbol = 4;
  string base_free = 5;                  // Base token available balance
  string base_locked = 6;                // Base token locked balance
  string quote_free = 7;                 // Quote token available balance
  string quote_locked = 8;               // Quote token locked balance
  string base_total = 9;                 // Base total (free + locked)
  string quote_total = 10;               // Quote total (free + locked)
  int64 last_sync_slot = 11;             // Last sync slot
  int32 status = 12;                     // Status: 0=Creating, 1=Normal, 2=Closed
  string init_tx_hash = 13;              // Initialize transaction hash
}

// Get order fills request
message GetLimitOrderFillsRequest {
  int64 chain_id = 1;                    // Chain ID
  string order_pda = 2;                  // Order PDA (optional)
  string user_wallet_address = 3;        // User wallet address (optional)
  string market_pda = 4;                 // Market PDA (optional)
  int32 page_no = 5;                     // Page number
  int32 page_size = 6;                   // Page size
}

message GetLimitOrderFillsResponse {
  repeated OrderFillItem fills = 1;
  int32 total = 2;
}

message OrderFillItem {
  string market_pda = 1;
  string base_symbol = 2;
  string quote_symbol = 3;
  string maker = 4;                      // Maker address
  string taker = 5;                      // Taker address
  string quantity = 6;                   // Fill quantity
  string price = 7;                      // Fill price
  string fee = 8;                        // Fee paid
  string total_value = 9;                // Total value
  string tx_hash = 10;                   // Transaction hash
  int64 slot = 11;                       // Slot number
  int64 created_at = 12;                 // Fill timestamp
}
