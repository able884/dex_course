Name: gateway # gateway name
Host: localhost # gateway host
Port: 8888 # gateway port
timeout: 60000000
MaxBytes: 3145728

Middlewares:
  Metrics: true
  Trace: true
  Breaker: false
  Prometheus: true

Gateway:
  DisableReflection: true

Log:
  ServiceName: gateway
  Encoding: plain
  Level: debug

RequestLimit:
  - Path: /ping
    QPS: 1000
  - Path: /api/liquidity/cpmm/tokens
    QPS: 60
  - Path: /api/liquidity/cpmm/fee-tiers
    QPS: 60
  - Path: /api/liquidity/cpmm/pools
    QPS: 20
  - Path: /v1/market/pool_detail
    QPS: 30
  - Path: /v1/market/quote_cpmm
    QPS: 60
  - Path: /v1/market/clmm_pool_depth
    QPS: 30
  - Path: /v1/trade/cpmm_swap
    QPS: 60
  - Path: /v1/trade/open_position
    QPS: 20
  - Path: /v1/limitorder/create
    QPS: 30
  - Path: /v1/limitorder/cancel
    QPS: 30
  - Path: /v1/limitorder/orderbook
    QPS: 60
  - Path: /v1/limitorder/user_orders
    QPS: 30
  - Path: /v1/limitorder/order_detail
    QPS: 30
  - Path: /v1/limitorder/markets
    QPS: 30
  - Path: /v1/limitorder/user_margin
    QPS: 30
  - Path: /v1/limitorder/fills
    QPS: 30
  - Path: /v1/limitorder/initialize_margin
    QPS: 30
  - Path: /v1/limitorder/sync_margin_status
    QPS: 30
  - Path: /v1/limitorder/create_market
    QPS: 10
  - Path: /v1/limitorder/sync_market_status
    QPS: 30
  - Path: /v1/limitorder/deposit_margin
    QPS: 30
  - Path: /v1/limitorder/withdraw_margin
    QPS: 30

IpRestriction:
  IsoCode: # example CN,US,HK,SG,JP
    - SG

Auth:
  Prefix: /v1/account
  JwtSecret:
  TgToken:

Redis:
  Host: 127.0.0.1
  Port: 6379
  Auth: "123456"
  MaxIdle: 20
  MaxActive: 100
  Db: 0
  Tls: false
  Type: "standalone"
  PingTimeout: 1s

Websocket:
  Host: http://127.0.0.1:13888
  Path: /ws

Upstreams: # upstreams
  - Grpc: # grpc upstream
      Target: 127.0.0.1:8090 # grpc target,the direct grpc server address,for only one node
      nonblock: true
      timeout: 5000 # 5 seconds timeout in milliseconds
    ProtoSets:
      - internal/embed/pb/market.pb
    # Mappings can also be written in proto options
    Mappings: # routes mapping
      - Method: get
        Path: /v1/market/index_pump
        RpcPath: market.Market/GetPumpTokenList
      - Method: get
        Path: /v1/market/index_clmm
        RpcPath: market.Market/GetClmmPoolList
      - Method: get
        Path: /v1/market/index_cpmm
        RpcPath: market.Market/GetClmmPoolList
      - Method: get
        Path: /v1/market/pool_detail
        RpcPath: market.Market/GetPoolDetail
      - Method: post
        Path: /v1/market/quote_cpmm
        RpcPath: market.Market/QuoteCpmm
      - Method: post
        Path: /v1/market/quote_clmm
        RpcPath: market.Market/QuoteClmm
      - Method: get
        Path: /v1/market/clmm_pool_depth
        RpcPath: market.Market/GetClmmPoolDepthData
      - Method: get
        Path: /v1/market/user_positions
        RpcPath: market.Market/GetUserPositions
      - Method: get
        Path: /v1/limitorder/orderbook
        RpcPath: market.Market/GetLimitOrderBook
      - Method: get
        Path: /v1/limitorder/user_orders
        RpcPath: market.Market/GetUserLimitOrders
      - Method: get
        Path: /v1/limitorder/order_detail
        RpcPath: market.Market/GetLimitOrderDetail
      - Method: get
        Path: /v1/limitorder/markets
        RpcPath: market.Market/GetLimitOrderMarkets
      - Method: get
        Path: /v1/limitorder/user_margin
        RpcPath: market.Market/GetUserMargin
      - Method: post
        Path: /v1/limitorder/sync_margin_balance
        RpcPath: market.Market/SyncMarginBalance
      - Method: get
        Path: /v1/limitorder/fills
        RpcPath: market.Market/GetLimitOrderFills
  - Name: trade
    Grpc: # trade service upstream
      Target: localhost:8100 # grpc target,the direct grpc server address,for only one node
      nonblock: true
      timeout: 60000000
    ProtoSets:
      - internal/embed/pb/trade.pb
    Mappings:
      - Method: post
        Path: /v1/trade/create_market_order
        RpcPath: trade.Trade/CreateMarketOrder
      - Method: post
        Path: /v1/pump/create_token
        RpcPath: trade.Trade/CreatePumpToken
      - Method: post
        Path: /v1/ipfs/upload_file
        RpcPath: trade.Trade/UploadIpfsFile
      - Method: post
        Path: /v1/ipfs/upload_metadata
        RpcPath: trade.Trade/UploadTokenMetadata
      - Method: post
        Path: /v1/pump/report_create_result
        RpcPath: trade.Trade/ReportPumpCreateResult
      - Method: post
        Path: /v1/pump/quote
        RpcPath: trade.Trade/QuotePumpTrade
      - Method: post
        Path: /v1/trade/add_cpmm_liquidity
        RpcPath: trade.Trade/AddCpmmLiquidity
      - Method: post
        Path: /v1/trade/remove_cpmm_liquidity
        RpcPath: trade.Trade/RemoveCpmmLiquidity
      - Method: post
        Path: /v1/trade/cpmm_swap
        RpcPath: trade.Trade/SwapCpmm
      - Method: post
        Path: /v1/trade/clmm_swap
        RpcPath: trade.Trade/SwapClmm
      - Method: post
        Path: /v1/trade/open_position
        RpcPath: trade.Trade/OpenPosition
      - Method: post
        Path: /v1/trade/increase_clmm_liquidity
        RpcPath: trade.Trade/IncreaseClmmLiquidity
      - Method: post
        Path: /v1/trade/decrease_clmm_liquidity
        RpcPath: trade.Trade/DecreaseClmmLiquidity
      - Method: post
        Path: /v1/limitorder/create
        RpcPath: trade.Trade/CreateLimitOrder
      - Method: post
        Path: /v1/limitorder/cancel
        RpcPath: trade.Trade/CancelLimitOrder
      - Method: post
        Path: /v1/limitorder/deposit_margin
        RpcPath: trade.Trade/DepositMargin
      - Method: post
        Path: /v1/limitorder/withdraw_margin
        RpcPath: trade.Trade/WithdrawMargin
  - Name: limitorder
    Grpc: # limitorder service upstream
      Target: localhost:8120 # limitorder service
      nonblock: true
      timeout: 60000000
    ProtoSets:
      - internal/embed/pb/limitorder.pb
    Mappings:
      - Method: post
        Path: /v1/limitorder/initialize_margin
        RpcPath: limitorder.LimitOrder/InitializeMarginAccount
      - Method: post
        Path: /v1/limitorder/sync_margin_status
        RpcPath: limitorder.LimitOrder/SyncMarginAccountStatus
      - Method: post
        Path: /v1/limitorder/create_market
        RpcPath: limitorder.LimitOrder/CreateMarket
      - Method: post
        Path: /v1/limitorder/sync_market_status
        RpcPath: limitorder.LimitOrder/SyncMarketStatus
whitelist:
  path:
    - /v1/market/index_pump
    - /v1/market/index_clmm
    - /v1/market/index_cpmm
    - /v1/market/pool_detail
    - /v1/market/quote_cpmm
    - /v1/market/clmm_pool_depth
    - /v1/market/user_positions
    - /v1/trade/create_market_order
    - /v1/pump/create_token
    - /v1/ipfs/upload_file
    - /v1/ipfs/upload_metadata
    - /v1/pump/report_create_result
    - /v1/pump/quote
    - /v1/trade/add_cpmm_liquidity
    - /v1/trade/open_position
    - /v1/trade/increase_clmm_liquidity
    - /v1/trade/decrease_clmm_liquidity
    - /v1/trade/remove_cpmm_liquidity
    - /v1/trade/cpmm_swap
    - /v1/limitorder/create
    - /v1/limitorder/cancel
    - /v1/limitorder/orderbook
    - /v1/limitorder/user_orders
    - /v1/limitorder/order_detail
    - /v1/limitorder/markets
    - /v1/limitorder/user_margin
    - /v1/limitorder/sync_margin_balance
    - /v1/limitorder/fills
    - /v1/limitorder/initialize_margin
    - /v1/limitorder/sync_margin_status
    - /v1/limitorder/create_market
    - /v1/limitorder/sync_market_status
    - /v1/limitorder/deposit_margin
    - /v1/limitorder/withdraw_margin
Liquidity:
  CacheTTLSeconds: 60
  Paths:
    Tokens: /api/liquidity/cpmm/tokens
    FeeTiers: /api/liquidity/cpmm/fee-tiers
    CreatePool: /api/liquidity/cpmm/pools
  RateLimit:
    TokensQPS: 60
    FeeTiersQPS: 60
    CreatePoolQPS: 20
